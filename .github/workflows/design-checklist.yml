name: Design checklist

# A pull request that touches the
# front carries the checklist of .github/pull_request_template.md with every box ticked, or its first
# box ("Không đổi giao diện"). Docs: docs/DESIGN_GOVERNANCE.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checklist:
    name: Design checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did the front change?
        id: front
        run: |
          if git diff --quiet "$BASE" HEAD -- $FRONT_PATHS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing on screen changed: no checklist needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FRONT_PATHS: src public/fonts messages packages/colorlab-tokens   # what counts as "the front changed"
          BASE: ${{ github.event.pull_request.base.sha }}

      # The description goes in through the environment, never into the script itself.
      - name: Every box ticked
        if: steps.front.outputs.changed == 'true'
        run: node .github/scripts/design-checklist.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
