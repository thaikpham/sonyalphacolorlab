name: CI

# The gate for Alpha ColorLab. `npm run verify` is the same command a developer
# runs locally.
#
# This briefly gated three apps: CheeseBooth and Sony Live SOP were workspaces
# under apps/ and had per-app verify and build steps here. They are separate
# repos again, each with its own CI, so this runs only what this repo can
# actually build — an `-w apps/…` step against a workspace that no longer exists
# does not skip, it fails the run with "No workspaces found".

on:
  push:
    branches:
      - main
      - '**'
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerates the shared design tokens and fails if anything changed,
      # which catches a hand-edited generated file before the drift test does
      # and gives a clearer message when it happens.
      #
      # Asserts a clean worktree rather than diffing a list of paths. The list
      # version named `apps/*/src/styles/colorlab-tokens`, and an unmatched git
      # pathspec exits 0 — so once the apps left, that arm of the guard checked
      # nothing and said so in green. Worse, `git diff` cannot see *untracked*
      # files, and the emitter creates missing directories, so a stale
      # destination in TARGETS would have written a whole apps/ tree onto the
      # runner and passed. `git status --porcelain` sees both, and needs no edit
      # the next time TARGETS changes.
      - name: Design tokens are current
        run: |
          npm run tokens:emit
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated token files are stale or wrote somewhere unexpected. Run 'npm run tokens:emit' and commit the result."
            exit 1
          fi

      # lint + typecheck + test + build.
      - name: Verify
        run: npm run verify

  # The browser gates (e2e/): a fresh production build in seed mode, then
  # layout at three widths, axe, 44px targets, CLS/JS/LCP budgets and the
  # first-screen counts. Its own job so `verify` stays the two-minute gate a
  # developer runs on every change; this one is what a design change waits
  # for. One runner until a run passes eight minutes, then shard by file.
  screens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Chromium that matches the Playwright version in the lockfile.
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Next's own build cache, kept between runs: a run rebuilds only what changed.
      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'packages/**', 'next.config.ts') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Screens
        run: npm run test:screens
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screens
          path: test-results/
          retention-days: 7
