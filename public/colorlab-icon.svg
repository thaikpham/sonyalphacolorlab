<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ColorLab">
  <title>ColorLab</title>
  <!--
    Four discs of light, overlapping in a square.

    The family's source grammar, and now drawn in the family's values: flat
    fills, no stroke and no gradient, running to a 4px margin, the saturated
    shapes at alpha 0.561 with one neutral at 0.251, composited plain
    source-over so every overlap resolves to a colour in neither disc. That is
    additive colour mixing, which is what this app does — a recipe is White
    Balance and a colour profile laid over each other.

    The primitive is the one the old PNG mark used, kept on purpose so the
    product stays recognisable; only its palette changed. That mark carried
    amber, teal and crimson — the one tile in the launcher whose colours came
    from nowhere in packages/colorlab-tokens, which is what made it read as a
    different family beside the wiki's cards and the blog's paragraph.

    Warm-and-cool set, every value a token: `ink` as the neutral at the back,
    then accent 500, `community` cyan and `danger` rose — blue, cyan and a
    warm red-violet standing in for the three channels of light. The rose is
    what separates this tile from the other two at a glance: the wiki is an
    all-cool ramp and the blog a violet one. It is the token's rose, not a
    fire-engine red, so no Canon, Nikon or Fuji signature appears.
  -->
  <circle cx="176" cy="80" r="76" fill="#F4F5F8" fill-opacity="0.251"/>
  <circle cx="80" cy="80" r="76" fill="#5C74F0" fill-opacity="0.561"/>
  <circle cx="80" cy="176" r="76" fill="#46B3C4" fill-opacity="0.561"/>
  <circle cx="176" cy="176" r="76" fill="#E05B6E" fill-opacity="0.561"/>
</svg>
