<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Sony Wiki">
  <title>Sony Wiki</title>
  <!--
    The paper version of sony-wiki-icon.svg, for `.theme-paper` rooms.

    Same four cards and the same 28x24 step. The neutral back card becomes
    paper `ink` at 0.12 instead of white at 0.251, and the saturated cards go
    to 0.72 so they do not wash out on a light ground. The middle card takes
    the PAPER accent-400 rather than the dark room's: the ramp is mirrored on
    paper, so it is the deeper blue there, and the climb in lightness across
    the exposed bands still runs deepest to brightest from back to front.
  -->
  <rect x="6" y="6" width="148" height="172" rx="26" fill="#15181F" fill-opacity="0.12"/>
  <rect x="34" y="30" width="148" height="172" rx="26" fill="#3957CC" fill-opacity="0.72"/>
  <rect x="62" y="54" width="148" height="172" rx="26" fill="#5C74F0" fill-opacity="0.72"/>
  <rect x="90" y="78" width="148" height="172" rx="26" fill="#46B3C4" fill-opacity="0.72"/>
</svg>
